name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LM_DEBUG_KEYSTORE: ${{ github.workspace }}/signing/lm-companion-debug.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare optional stable debug signing
        env:
          LM_DEBUG_KEYSTORE_B64: ${{ secrets.LM_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "${LM_DEBUG_KEYSTORE_B64:-}" ]; then
            mkdir -p signing
            printf '%s' "$LM_DEBUG_KEYSTORE_B64" | base64 --decode > "$LM_DEBUG_KEYSTORE"
            test -s "$LM_DEBUG_KEYSTORE"
            echo "Stable debug signing enabled."
          else
            echo "LM_DEBUG_KEYSTORE_B64 is not configured; using the standard Android debug signing key."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle clean testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lm-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Verify build output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
