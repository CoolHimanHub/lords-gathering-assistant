name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LM_DEBUG_KEYSTORE: ${{ github.workspace }}/signing/lm-companion-debug.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare stable debug signing
        env:
          LM_DEBUG_KEYSTORE_B64: ${{ secrets.LM_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$LM_DEBUG_KEYSTORE_B64" || {
            echo "Missing required repository secret: LM_DEBUG_KEYSTORE_B64"
            exit 1
          }
          mkdir -p signing
          printf '%s' "$LM_DEBUG_KEYSTORE_B64" | base64 --decode > "$LM_DEBUG_KEYSTORE"
          test -s "$LM_DEBUG_KEYSTORE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle clean testDebugUnitTest --stacktrace

      - name: Build final APK
        run: gradle assembleDebug --stacktrace

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: lm-companion-final
          path: app/build/outputs/apk/debug/app-debug.apk
